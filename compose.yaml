services:
  postgres:
    image: postgres:16-alpine
    container_name: aguafix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-aguafix}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aguafix}
      POSTGRES_DB: ${DB_NAME:-aguafix}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - aguafix-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-aguafix} -d ${DB_NAME:-aguafix}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ${DOCKER_USER}/aguafix-api:latest
    container_name: aguafix-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Dentro de la red de compose la API ve a Postgres por su nombre de servicio
      DB_HOST: postgres
      DB_PORT: 5432
    ports:
      - "${PORT:-3000}:3000"

volumes:
  aguafix-postgres-data:
